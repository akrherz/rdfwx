ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 'v10.8.0'
    hooks:
      - id: eslint
        additional_dependencies:
          - "eslint"
          - "@eslint/js"
          - "globals"
        files: \.js?$
        types: [file]
        args:
        - --fix
        language_version: 'system'  # Use system Node.js which should support ES modules

